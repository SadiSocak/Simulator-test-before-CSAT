<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모의고사 성적 & 오답 분석 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Font Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased min-h-screen">

    <!-- Header / Navbar -->
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 sm:px-6 lg:px-8 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-2xl text-indigo-200"></i>
                <h1 class="text-xl font-bold tracking-tight sm:text-2xl">모고 오답노트 & 성적 분석</h1>
            </div>
            <button onclick="openModal()" class="bg-indigo-500 hover:bg-indigo-400 text-white font-medium px-4 py-2 rounded-lg shadow-sm transition flex items-center gap-2 text-sm">
                <i class="fa-solid fa-plus"></i> 모의고사 등록
            </button>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 py-6 sm:px-6 lg:px-8 space-y-8">

        <!-- 분석 대시보드 섹션 -->
        <section class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 space-y-6">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b pb-4">
                <div>
                    <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                        <i class="fa-solid fa-chart-pie text-indigo-600"></i> 과목별 성적 & 취약점 분석 대시보드
                    </h2>
                    <p class="text-sm text-slate-500">과목 탭을 클릭하면 상단 카드와 모든 차트가 선택한 과목 기준으로 바뀝니다.</p>
                </div>
                
                <!-- 과목 선택 탭 -->
                <div class="flex flex-wrap gap-1 bg-slate-100 p-1 rounded-lg text-sm font-medium">
                    <button onclick="switchTab('ALL')" id="tab-ALL" class="tab-btn px-3 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm font-bold">전체</button>
                    <button onclick="switchTab('국어')" id="tab-국어" class="tab-btn px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900">국어</button>
                    <button onclick="switchTab('수학')" id="tab-수학" class="tab-btn px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900">수학</button>
                    <button onclick="switchTab('영어')" id="tab-영어" class="tab-btn px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900">영어</button>
                    <button onclick="switchTab('탐구')" id="tab-탐구" class="tab-btn px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900">탐구</button>
                </div>
            </div>

            <!-- 과목별 동적 상단 스탯 카드리스트 -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center space-x-4">
                    <div class="p-3 bg-indigo-100 text-indigo-600 rounded-lg">
                        <i class="fa-solid fa-book-bookmark text-xl"></i>
                    </div>
                    <div>
                        <p id="label-stat-exams" class="text-xs font-semibold text-slate-500 uppercase">[전체] 응시 시험</p>
                        <p id="stat-total-exams" class="text-2xl font-bold text-slate-800">0회</p>
                    </div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center space-x-4">
                    <div class="p-3 bg-rose-100 text-rose-600 rounded-lg">
                        <i class="fa-solid fa-circle-exclamation text-xl"></i>
                    </div>
                    <div>
                        <p id="label-stat-errors" class="text-xs font-semibold text-slate-500 uppercase">[전체] 기록된 오답</p>
                        <p id="stat-total-errors" class="text-2xl font-bold text-slate-800">0개</p>
                    </div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center space-x-4">
                    <div class="p-3 bg-emerald-100 text-emerald-600 rounded-lg">
                        <i class="fa-solid fa-chart-line text-xl"></i>
                    </div>
                    <div>
                        <p id="label-stat-grade" class="text-xs font-semibold text-slate-500 uppercase">[전체] 최근 등급</p>
                        <p id="stat-recent-grade" class="text-2xl font-bold text-slate-800">- 등급</p>
                    </div>
                </div>
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 flex items-center space-x-4">
                    <div class="p-3 bg-amber-100 text-amber-600 rounded-lg">
                        <i class="fa-solid fa-triangle-exclamation text-xl"></i>
                    </div>
                    <div>
                        <p id="label-stat-reason" class="text-xs font-semibold text-slate-500 uppercase">[전체] 최대 오답 원인</p>
                        <p id="stat-main-reason" class="text-base font-bold text-slate-800 truncate max-w-[140px]">-</p>
                    </div>
                </div>
            </div>

            <!-- 기본 차트 영역 -->
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 pt-2">
                <!-- 원점수 추이 차트 -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-arrow-trend-up text-indigo-500"></i> 원점수 변화 추이
                    </h3>
                    <div class="h-64 relative">
                        <canvas id="scoreTrendChart"></canvas>
                    </div>
                </div>

                <!-- 오답 원인 차트 -->
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-100">
                    <h3 class="text-sm font-bold text-slate-700 mb-3 flex items-center gap-2">
                        <i class="fa-solid fa-chart-doughnut text-rose-500"></i> 오답 발생 원인 비율
                    </h3>
                    <div class="h-64 relative">
                        <canvas id="errorReasonChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- 국어 전용: 세부 영역 차트 -->
            <div id="korean-analysis-box" class="hidden bg-emerald-50/50 p-5 rounded-xl border border-emerald-100 space-y-3">
                <h3 class="text-sm font-bold text-emerald-900 flex items-center gap-2">
                    <i class="fa-solid fa-book-open text-emerald-600"></i> [국어 전용] 독서·문학·선택 영역별 오답 분포
                </h3>
                <div class="h-60 relative">
                    <canvas id="koreanUnitChart"></canvas>
                </div>
            </div>

            <!-- 수학 전용: 세부 단원 차트 -->
            <div id="math-analysis-box" class="hidden bg-indigo-50/50 p-5 rounded-xl border border-indigo-100 space-y-3">
                <h3 class="text-sm font-bold text-indigo-900 flex items-center gap-2">
                    <i class="fa-solid fa-square-root-variable text-indigo-600"></i> [수학 전용] 수1·수2·선택 단원별 오답 분포
                </h3>
                <div class="h-60 relative">
                    <canvas id="mathUnitChart"></canvas>
                </div>
            </div>
        </section>

        <!-- 성적 및 오답 기록 목록 섹션 -->
        <section class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <h2 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-indigo-600"></i> 등록된 모의고사 목록
                </h2>
                <!-- 필터 및 검색 -->
                <div class="flex items-center gap-2">
                    <select id="filter-subject" onchange="renderExamList()" class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="ALL">전체 과목 보기</option>
                        <option value="국어">국어</option>
                        <option value="수학">수학</option>
                        <option value="영어">영어</option>
                        <option value="한국사">한국사</option>
                        <option value="탐구1">탐구1</option>
                        <option value="탐구2">탐구2</option>
                    </select>
                    <input type="text" id="search-keyword" oninput="renderExamList()" placeholder="시험명/메모/단원 검색..." class="bg-white border border-slate-300 text-slate-700 text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 w-44 sm:w-60">
                </div>
            </div>

            <!-- 카드 바디 -->
            <div id="exam-list-container" class="space-y-4">
                <!-- 동적 카드 추가됨 -->
            </div>
        </section>

    </main>

    <!-- 모의고사 등록 및 오답 추가 모달 -->
    <div id="exam-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto border border-slate-100">
            <div class="sticky top-0 bg-white px-6 py-4 border-b flex justify-between items-center z-10">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 모의고사 성적 & 오답 등록
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <form id="exam-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-6">
                <!-- 기본 정보 -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">과목 <span class="text-rose-500">*</span></label>
                        <select id="form-subject" onchange="toggleSubjectFields()" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="국어">국어</option>
                            <option value="수학">수학</option>
                            <option value="영어">영어</option>
                            <option value="한국사">한국사</option>
                            <option value="탐구1">탐구1</option>
                            <option value="탐구2">탐구2</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">시험명 / 회차 <span class="text-rose-500">*</span></label>
                        <input type="text" id="form-title" required placeholder="예: 3월 학평, 이감 1회차" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">응시 일자</label>
                        <input type="date" id="form-date" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">원점수 / 등급</label>
                        <div class="flex gap-2">
                            <input type="number" id="form-score" min="0" max="100" placeholder="점수" required class="w-1/2 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <input type="number" id="form-grade" min="1" max="9" placeholder="등급" required class="w-1/2 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- 오답 문항 상세 등록 -->
                <div class="border-t pt-4 space-y-3">
                    <div class="flex justify-between items-center">
                        <h4 class="text-sm font-bold text-slate-800 flex items-center gap-1">
                            <i class="fa-solid fa-xmark text-rose-500"></i> 틀린 문항 오답 기록
                        </h4>
                        <button type="button" onclick="addErrorItemField()" class="text-xs bg-indigo-50 text-indigo-600 hover:bg-indigo-100 font-semibold px-3 py-1.5 rounded-lg border border-indigo-200 transition">
                            + 문항 추가
                        </button>
                    </div>

                    <div id="error-items-container" class="space-y-3">
                        <!-- 동적 오답 문항들 입력폼 -->
                    </div>
                </div>

                <!-- 전체 총평 및 피드백 -->
                <div class="border-t pt-4">
                    <label class="block text-xs font-semibold text-slate-600 mb-1">시험 총평 / 반성 메모</label>
                    <textarea id="form-memo" rows="2" placeholder="시간 배분 문제, 시험 볼 때의 컨디션, 다음 시험 다짐 등을 적어보세요." class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <!-- 하단 버튼 -->
                <div class="flex justify-end gap-2 border-t pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm font-medium">취소</button>
                    <button type="submit" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium shadow-sm">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- JS 스크립트 -->
    <script>
        // 전역 데이터 저장소
        let examData = JSON.parse(localStorage.getItem('mockExamsData')) || [];
        let currentTab = 'ALL';

        // 차트 객체 변수
        let scoreChartInstance = null;
        let reasonChartInstance = null;
        let koreanUnitChartInstance = null;
        let mathUnitChartInstance = null;

        // 초기화 함수
        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('form-date').value = new Date().toISOString().substring(0, 10);
            updateDashboardStats();
            renderCharts();
            renderExamList();
        });

        // 모달 열기/닫기
        function openModal() {
            document.getElementById('exam-form').reset();
            document.getElementById('error-items-container').innerHTML = '';
            document.getElementById('form-date').value = new Date().toISOString().substring(0, 10);
            addErrorItemField();
            toggleSubjectFields();
            document.getElementById('exam-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('exam-modal').classList.add('hidden');
        }

        // 과목별 입력 세부 옵션 전환
        function toggleSubjectFields() {
            const subject = document.getElementById('form-subject').value;
            const container = document.getElementById('error-items-container');
            // 기존 등록된 필드들의 드롭다운을 과목에 맞게 재구성
            const rows = container.querySelectorAll('.error-item-row');
            rows.forEach(row => {
                const unitSelect = row.querySelector('.err-unit');
                if(unitSelect) {
                    unitSelect.innerHTML = getUnitOptionsHtml(subject);
                }
            });
        }

        // 과목에 맞는 세부 단원 드롭다운 HTML 생성
        function getUnitOptionsHtml(subject, selectedValue = '') {
            if (subject === '국어') {
                return `
                    <option value="기타" ${selectedValue === '기타' ? 'selected' : ''}>영역 선택</option>
                    <option value="국어-독서" ${selectedValue === '국어-독서' ? 'selected' : ''}>독서 (비문학)</option>
                    <option value="국어-문학" ${selectedValue === '국어-문학' ? 'selected' : ''}>문학</option>
                    <option value="국어-화작" ${selectedValue === '국어-화작' ? 'selected' : ''}>선택: 화법과 작문</option>
                    <option value="국어-언매" ${selectedValue === '국어-언매' ? 'selected' : ''}>선택: 언어와 매체</option>
                `;
            } else if (subject === '수학') {
                return `
                    <option value="기타" ${selectedValue === '기타' ? 'selected' : ''}>단원 선택</option>
                    <optgroup label="수학 I">
                        <option value="수1-지수로그" ${selectedValue === '수1-지수로그' ? 'selected' : ''}>수1: 지수·로그</option>
                        <option value="수1-삼각함수" ${selectedValue === '수1-삼각함수' ? 'selected' : ''}>수1: 삼각함수</option>
                        <option value="수1-수열" ${selectedValue === '수1-수열' ? 'selected' : ''}>수1: 수열</option>
                    </optgroup>
                    <optgroup label="수학 II">
                        <option value="수2-함수의극한" ${selectedValue === '수2-함수의극한' ? 'selected' : ''}>수2: 함수의 극한/연속</option>
                        <option value="수2-미분" ${selectedValue === '수2-미분' ? 'selected' : ''}>수2: 미분</option>
                        <option value="수2-적분" ${selectedValue === '수2-적분' ? 'selected' : ''}>수2: 적분</option>
                    </optgroup>
                    <optgroup label="선택과목">
                        <option value="선택-확통" ${selectedValue === '선택-확통' ? 'selected' : ''}>선택: 확률과 통계</option>
                        <option value="선택-미적분" ${selectedValue === '선택-미적분' ? 'selected' : ''}>선택: 미적분</option>
                        <option value="선택-기하" ${selectedValue === '선택-기하' ? 'selected' : ''}>선택: 기하</option>
                    </optgroup>
                `;
            } else {
                return `<option value="기타">세부 영역 해당없음</option>`;
            }
        }

        // 오답 문항 필드 동적 추가
        function addErrorItemField(data = {}) {
            const container = document.getElementById('error-items-container');
            const subject = document.getElementById('form-subject').value;

            const itemDiv = document.createElement('div');
            itemDiv.className = "error-item-row bg-slate-50 p-3 rounded-lg border border-slate-200 space-y-2 relative";
            itemDiv.innerHTML = `
                <button type="button" onclick="this.parentElement.remove()" class="absolute top-2 right-2 text-slate-400 hover:text-rose-500 font-bold text-sm">&times;</button>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-2">
                    <div>
                        <input type="text" class="err-num border border-slate-300 rounded px-2 py-1 text-sm w-full" placeholder="문항 번호 (예: 15번, 22번)" value="${data.num || ''}" required>
                    </div>
                    <div>
                        <select class="err-unit border border-slate-300 rounded px-2 py-1 text-sm w-full">
                            ${getUnitOptionsHtml(subject, data.unit)}
                        </select>
                    </div>
                    <div>
                        <select class="err-reason border border-slate-300 rounded px-2 py-1 text-sm w-full" required>
                            <option value="개념 부족" ${data.reason === '개념 부족' ? 'selected' : ''}>개념/지문 이해 부족</option>
                            <option value="계산 실수" ${data.reason === '계산 실수' ? 'selected' : ''}>계산/단순 실수</option>
                            <option value="시간 부족" ${data.reason === '시간 부족' ? 'selected' : ''}>시간 부족</option>
                            <option value="문제 오독" ${data.reason === '문제 오독' ? 'selected' : ''}>문제 오독/조건 판단 미흡</option>
                            <option value="찍음/기타" ${data.reason === '찍음/기타' ? 'selected' : ''}>찍음/기타</option>
                        </select>
                    </div>
                </div>
                <div>
                    <input type="text" class="err-note border border-slate-300 rounded px-2 py-1 text-sm w-full" placeholder="틀린 원인 분석 및 핵심 메모" value="${data.note || ''}">
                </div>
            `;
            container.appendChild(itemDiv);
        }

        // Form 저장 처리
        function handleFormSubmit(e) {
            e.preventDefault();

            const subject = document.getElementById('form-subject').value;
            const title = document.getElementById('form-title').value;
            const date = document.getElementById('form-date').value;
            const score = parseInt(document.getElementById('form-score').value);
            const grade = parseInt(document.getElementById('form-grade').value);
            const memo = document.getElementById('form-memo').value;

            const errorRows = document.querySelectorAll('.error-item-row');
            const errorItems = [];
            errorRows.forEach(row => {
                const num = row.querySelector('.err-num').value;
                const unit = row.querySelector('.err-unit') ? row.querySelector('.err-unit').value : '기타';
                const reason = row.querySelector('.err-reason').value;
                const note = row.querySelector('.err-note').value;
                if(num) {
                    errorItems.push({ num, unit, reason, note });
                }
            });

            const newExam = {
                id: Date.now(),
                subject,
                title,
                date,
                score,
                grade,
                memo,
                errorItems
            };

            examData.push(newExam);
            examData.sort((a, b) => new Date(a.date) - new Date(b.date));

            localStorage.setItem('mockExamsData', JSON.stringify(examData));
            closeModal();
            updateDashboardStats();
            renderCharts();
            renderExamList();
        }

        // 데이터 삭제
        function deleteExam(id) {
            if(confirm('해당 기록을 삭제하시겠습니까?')) {
                examData = examData.filter(item => item.id !== id);
                localStorage.setItem('mockExamsData', JSON.stringify(examData));
                updateDashboardStats();
                renderCharts();
                renderExamList();
            }
        }

        // 탭 필터링 헬퍼
        function getFilteredExams() {
            if(currentTab === 'ALL') return examData;
            if(currentTab === '탐구') return examData.filter(e => e.subject === '탐구1' || e.subject === '탐구2');
            return examData.filter(e => e.subject === currentTab);
        }

        // 상단 스탯 업데이트
        function updateDashboardStats() {
            const filteredExams = getFilteredExams();
            const labelText = currentTab === 'ALL' ? '[전체]' : `[${currentTab}]`;

            document.getElementById('label-stat-exams').innerText = `${labelText} 응시 시험`;
            document.getElementById('label-stat-errors').innerText = `${labelText} 기록된 오답`;
            document.getElementById('label-stat-grade').innerText = `${labelText} 최근 등급`;
            document.getElementById('label-stat-reason').innerText = `${labelText} 최대 오답 원인`;

            // 1. 총 응시 시험
            document.getElementById('stat-total-exams').innerText = `${filteredExams.length}회`;

            // 2. 총 오답 & 오답 원인 집계
            let totalErrors = 0;
            let reasonCounts = {};

            filteredExams.forEach(exam => {
                totalErrors += exam.errorItems.length;
                exam.errorItems.forEach(item => {
                    reasonCounts[item.reason] = (reasonCounts[item.reason] || 0) + 1;
                });
            });

            document.getElementById('stat-total-errors').innerText = `${totalErrors}개`;

            // 3. 최근 등급
            if(filteredExams.length > 0) {
                const latestExam = filteredExams[filteredExams.length - 1];
                document.getElementById('stat-recent-grade').innerText = `${latestExam.grade} 등급`;
            } else {
                document.getElementById('stat-recent-grade').innerText = `- 등급`;
            }

            // 4. 주요 오답 원인
            let mainReason = '-';
            let maxCount = 0;
            for(const [reason, count] of Object.entries(reasonCounts)) {
                if(count > maxCount) {
                    maxCount = count;
                    mainReason = reason;
                }
            }
            document.getElementById('stat-main-reason').innerText = mainReason;
        }

        // 대시보드 탭 스위치
        function switchTab(tab) {
            currentTab = tab;
            
            // 버튼 스타일 업데이트
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900";
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if(activeBtn) {
                activeBtn.className = "tab-btn px-3 py-1.5 rounded-md bg-white text-indigo-600 shadow-sm font-bold";
            }

            // 과목별 전용 박스 표시/숨김
            const koreanBox = document.getElementById('korean-analysis-box');
            const mathBox = document.getElementById('math-analysis-box');
            
            if(tab === '국어') {
                koreanBox.classList.remove('hidden');
                mathBox.classList.add('hidden');
            } else if(tab === '수학') {
                mathBox.classList.remove('hidden');
                koreanBox.classList.add('hidden');
            } else {
                koreanBox.classList.add('hidden');
                mathBox.classList.add('hidden');
            }

            // 데이터 갱신
            updateDashboardStats();
            renderCharts();
        }

        // 차트 렌더링 함수
        function renderCharts() {
            const filteredExams = getFilteredExams();

            // 1. 원점수 추이 차트
            const scoreCtx = document.getElementById('scoreTrendChart').getContext('2d');
            if(scoreChartInstance) scoreChartInstance.destroy();

            const labels = filteredExams.map(e => `${e.date.substring(5)} (${e.subject.substring(0,2)})`);
            const scores = filteredExams.map(e => e.score);

            scoreChartInstance = new Chart(scoreCtx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: '원점수',
                        data: scores,
                        borderColor: '#4f46e5',
                        backgroundColor: 'rgba(79, 70, 229, 0.1)',
                        fill: true,
                        tension: 0.3,
                        pointRadius: 5,
                        pointHoverRadius: 7
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: { min: 0, max: 100 }
                    }
                }
            });

            // 2. 오답 원인 차트
            const reasonCtx = document.getElementById('errorReasonChart').getContext('2d');
            if(reasonChartInstance) reasonChartInstance.destroy();

            let reasonCounts = { '개념 부족': 0, '계산 실수': 0, '시간 부족': 0, '문제 오독': 0, '찍음/기타': 0 };
            filteredExams.forEach(e => {
                e.errorItems.forEach(item => {
                    if(reasonCounts[item.reason] !== undefined) {
                        reasonCounts[item.reason]++;
                    } else {
                        reasonCounts['찍음/기타']++;
                    }
                });
            });

            reasonChartInstance = new Chart(reasonCtx, {
                type: 'doughnut',
                data: {
                    labels: Object.keys(reasonCounts),
                    datasets: [{
                        data: Object.values(reasonCounts),
                        backgroundColor: ['#f43f5e', '#3b82f6', '#f59e0b', '#10b981', '#6b7280']
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { position: 'right' }
                    }
                }
            });

            // 3. 국어 세부 차트 (국어 탭 활성화 시)
            if(currentTab === '국어') {
                const koreanCtx = document.getElementById('koreanUnitChart').getContext('2d');
                if(koreanUnitChartInstance) koreanUnitChartInstance.destroy();

                let korCounts = { "독서 (비문학)": 0, "문학": 0, "선택 (화작/언매)": 0 };

                filteredExams.forEach(e => {
                    e.errorItems.forEach(item => {
                        if(item.unit.includes('독서')) korCounts["독서 (비문학)"]++;
                        else if(item.unit.includes('문학')) korCounts["문학"]++;
                        else if(item.unit.includes('화작') || item.unit.includes('언매')) korCounts["선택 (화작/언매)"]++;
                    });
                });

                koreanUnitChartInstance = new Chart(koreanCtx, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(korCounts),
                        datasets: [{
                            label: '틀린 문항 수',
                            data: Object.values(korCounts),
                            backgroundColor: '#10b981'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true, ticks: { stepSize: 1 } }
                        }
                    }
                });
            }

            // 4. 수학 세부 차트 (수학 탭 활성화 시)
            if(currentTab === '수학') {
                const mathCtx = document.getElementById('mathUnitChart').getContext('2d');
                if(mathUnitChartInstance) mathUnitChartInstance.destroy();

                let unitCounts = {
                    "지수·로그": 0, "삼각함수": 0, "수열": 0,
                    "함수의극한": 0, "미분": 0, "적분": 0,
                    "선택과목": 0
                };

                filteredExams.forEach(e => {
                    e.errorItems.forEach(item => {
                        if(item.unit.includes('지수로그')) unitCounts["지수·로그"]++;
                        else if(item.unit.includes('삼각함수')) unitCounts["삼각함수"]++;
                        else if(item.unit.includes('수열')) unitCounts["수열"]++;
                        else if(item.unit.includes('함수의극한')) unitCounts["함수의극한"]++;
                        else if(item.unit.includes('미분')) unitCounts["미분"]++;
                        else if(item.unit.includes('적분')) unitCounts["적분"]++;
                        else if(item.unit.includes('선택')) unitCounts["선택과목"]++;
                    });
                });

                mathUnitChartInstance = new Chart(mathCtx, {
                    type: 'bar',
                    data: {
                        labels: Object.keys(unitCounts),
                        datasets: [{
                            label: '틀린 문항 수',
                            data: Object.values(unitCounts),
                            backgroundColor: '#6366f1'
                        }]
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: { beginAtZero: true, ticks: { stepSize: 1 } }
                        }
                    }
                });
            }
        }

        // 시험 목록 카드 출력
        function renderExamList() {
            const container = document.getElementById('exam-list-container');
            const subjectFilter = document.getElementById('filter-subject').value;
            const keyword = document.getElementById('search-keyword').value.toLowerCase();

            container.innerHTML = '';

            let list = [...examData].reverse();

            if(subjectFilter !== 'ALL') {
                list = list.filter(e => e.subject === subjectFilter);
            }

            if(keyword) {
                list = list.filter(e => 
                    e.title.toLowerCase().includes(keyword) || 
                    e.memo.toLowerCase().includes(keyword) ||
                    e.errorItems.some(i => i.note.toLowerCase().includes(keyword) || i.num.toLowerCase().includes(keyword) || i.unit.toLowerCase().includes(keyword))
                );
            }

            if(list.length === 0) {
                container.innerHTML = `
                    <div class="bg-white p-8 rounded-xl border border-slate-200 text-center text-slate-400">
                        <i class="fa-solid fa-folder-open text-4xl mb-2"></i>
                        <p>등록된 모의고사 기록이 없습니다.</p>
                    </div>
                `;
                return;
            }

            list.forEach(exam => {
                const card = document.createElement('div');
                card.className = "bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden space-y-3 p-5";

                let errorItemsHtml = '';
                if(exam.errorItems && exam.errorItems.length > 0) {
                    errorItemsHtml = exam.errorItems.map(item => `
                        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-100 text-xs flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                            <div class="flex items-center gap-2">
                                <span class="font-bold text-rose-600 bg-rose-50 px-2 py-0.5 rounded border border-rose-100">${item.num}</span>
                                ${item.unit && item.unit !== '기타' ? `<span class="bg-indigo-50 text-indigo-600 px-1.5 py-0.5 rounded font-semibold">${item.unit}</span>` : ''}
                                <span class="text-slate-500 font-medium">[${item.reason}]</span>
                            </div>
                            <div class="text-slate-700 font-medium sm:text-right">
                                ${item.note || '메모 없음'}
                            </div>
                        </div>
                    `).join('');
                } else {
                    errorItemsHtml = '<p class="text-xs text-slate-400 italic">틀린 문항 기록이 없습니다.</p>';
                }

                card.innerHTML = `
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between border-b pb-3 gap-2">
                        <div class="flex items-center gap-3">
                            <span class="px-2.5 py-1 rounded-md text-xs font-bold bg-indigo-100 text-indigo-700">${exam.subject}</span>
                            <h3 class="font-bold text-slate-800 text-base">${exam.title}</h3>
                            <span class="text-xs text-slate-400">${exam.date}</span>
                        </div>
                        <div class="flex items-center gap-4">
                            <div class="text-right">
                                <span class="text-lg font-black text-indigo-600">${exam.score}점</span>
                                <span class="text-xs font-bold text-slate-500 ml-1">(${exam.grade}등급)</span>
                            </div>
                            <button onclick="deleteExam(${exam.id})" class="text-slate-300 hover:text-rose-500 text-sm transition">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>

                    ${exam.memo ? `<p class="text-xs text-slate-600 bg-amber-50/60 p-2.5 rounded-lg border border-amber-100"><i class="fa-solid fa-comment-dots text-amber-500 mr-1"></i> ${exam.memo}</p>` : ''}

                    <div class="space-y-1.5 pt-1">
                        <p class="text-xs font-bold text-slate-500">틀린 문항 노트 (${exam.errorItems.length}개)</p>
                        <div class="space-y-1.5">
                            ${errorItemsHtml}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
    </script>
</body>
</html>
