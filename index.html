<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReprintOCR 스타일 모고 대시보드</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f5f6f8] font-sans text-slate-800 antialiased min-h-screen pb-20">

    <!-- Header / Top Navbar -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-6xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center space-x-8">
                <div class="flex items-center space-x-2">
                    <i class="fa-solid fa-feather-pointed text-indigo-600 text-lg"></i>
                    <span class="font-extrabold text-slate-800 tracking-tight text-lg">Reprint<span class="text-indigo-600">OCR</span></span>
                </div>
                <nav class="hidden sm:flex space-x-6 text-sm font-semibold text-slate-500">
                    <a href="#" class="hover:text-slate-900 transition py-4">실모</a>
                    <a href="#" class="hover:text-slate-900 transition py-4">채점</a>
                    <a href="#" class="text-slate-900 border-b-2 border-slate-900 py-4">프로필 및 설정</a>
                    <a href="#" class="hover:text-slate-900 transition py-4">정답표</a>
                </nav>
            </div>
            <button onclick="openModal()" class="text-indigo-600 hover:text-indigo-800 text-sm font-bold transition flex items-center gap-1">
                <i class="fa-solid fa-plus text-xs"></i> 성적 직접 입력
            </button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 pt-6 space-y-8">

        <!-- 성적 추세 섹션 -->
        <section class="space-y-4">
            <div class="flex items-center justify-between">
                <h1 class="text-xl font-bold text-slate-900">성적 추세</h1>
                <button onclick="openModal()" class="bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 text-sm font-bold px-4 py-2 rounded-xl shadow-sm transition flex items-center gap-1.5">
                    + 성적 직접 입력
                </button>
            </div>

            <!-- 차트 대시보드 카드 -->
            <div class="bg-white rounded-2xl border border-slate-200/80 shadow-sm p-6 space-y-6">
                <div class="flex items-center justify-between">
                    <!-- 점수 / 등급 토글 -->
                    <div class="bg-slate-100 p-1 rounded-lg flex gap-1 text-xs font-bold">
                        <button id="mode-score-btn" onclick="toggleViewMode('score')" class="px-4 py-1.5 rounded-md bg-indigo-600 text-white shadow-sm transition">점수</button>
                        <button id="mode-grade-btn" onclick="toggleViewMode('grade')" class="px-4 py-1.5 rounded-md text-slate-500 hover:text-slate-900 transition">등급</button>
                    </div>
                </div>

                <!-- 메인 그래프 -->
                <div class="h-72 relative">
                    <canvas id="trendChart"></canvas>
                </div>

                <!-- 과목 칩(뱃지) 레전드 -->
                <div class="flex flex-wrap gap-2 pt-2" id="subject-legend-container">
                    <!-- JS로 과목별 뱃지 자동 생성 -->
                </div>
            </div>
        </section>

        <!-- 채점 기록 섹션 -->
        <section class="space-y-4">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                <h2 class="text-xl font-bold text-slate-900">채점 기록</h2>
            </div>

            <!-- 검색 및 보기 옵션 필터 -->
            <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-slate-100/80 p-1.5 rounded-xl">
                <div class="relative w-full sm:w-96">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-400 text-xs"></i>
                    <input type="text" id="search-keyword" oninput="renderExamList()" placeholder="시험 이름·과목으로 검색 (예: 9월 모평, 언어와 매체)" class="w-full bg-white border border-slate-200 text-slate-800 text-sm rounded-lg pl-9 pr-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 transition">
                </div>
                
                <!-- 과목 선택 필터 -->
                <div class="flex gap-1 bg-white p-1 rounded-lg border border-slate-200 text-xs font-bold w-full sm:w-auto justify-center">
                    <button onclick="switchTab('ALL')" id="tab-ALL" class="tab-btn px-3 py-1.5 rounded-md bg-indigo-50 text-indigo-600">전체</button>
                    <button onclick="switchTab('국어')" id="tab-국어" class="tab-btn px-3 py-1.5 rounded-md text-slate-500">국어</button>
                    <button onclick="switchTab('수학')" id="tab-수학" class="tab-btn px-3 py-1.5 rounded-md text-slate-500">수학</button>
                    <button onclick="switchTab('영어')" id="tab-영어" class="tab-btn px-3 py-1.5 rounded-md text-slate-500">영어</button>
                    <button onclick="switchTab('탐구')" id="tab-탐구" class="tab-btn px-3 py-1.5 rounded-md text-slate-500">탐구</button>
                </div>
            </div>

            <!-- 깔끔한 모의고사 리스트 바디 -->
            <div id="exam-list-container" class="space-y-8 pt-2"></div>
        </section>

    </main>

    <!-- 모의고사 등록 및 수정 모달 -->
    <div id="exam-modal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-2xl max-h-[90vh] overflow-y-auto border border-slate-100">
            <div class="sticky top-0 bg-white px-6 py-4 border-b flex justify-between items-center z-10">
                <h3 id="modal-form-title" class="text-base font-bold text-slate-800 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square text-indigo-600"></i> 성적 직접 입력
                </h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <form id="exam-form" onsubmit="handleFormSubmit(event)" class="p-6 space-y-5">
                <input type="hidden" id="editing-exam-id" value="">

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">과목 <span class="text-rose-500">*</span></label>
                        <select id="form-subject" onchange="handleSubjectOrCountChange()" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="국어">국어</option>
                            <option value="수학">수학</option>
                            <option value="영어">영어</option>
                            <option value="한국사">한국사</option>
                            <option value="탐구1">탐구1 (선택1)</option>
                            <option value="탐구2">탐구2 (선택2)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">세부과목명 / 선택과목</label>
                        <input type="text" id="form-detail-subject" placeholder="예: 언어와 매체, 미적분, 세계지리" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">시험명 / 회차 <span class="text-rose-500">*</span></label>
                        <input type="text" id="form-title" required placeholder="예: 2027학년도 9월 모의평가, 시대인재 16회" class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">응시 일자</label>
                        <input type="date" id="form-date" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">원점수 / 등급</label>
                        <div class="flex gap-2">
                            <input type="number" id="form-score" min="0" max="100" placeholder="점수" required class="w-1/2 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                            <input type="number" id="form-grade" min="1" max="9" placeholder="등급" required class="w-1/2 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                        </div>
                    </div>
                </div>

                <!-- 틀린 개수 선택 기능 (최대 15개) -->
                <div class="border-t pt-4 space-y-3">
                    <div class="flex items-center justify-between">
                        <label class="block text-xs font-bold text-slate-700">
                            틀린 개수 선택 (최대 15개)
                        </label>
                        <select id="form-error-count" onchange="generateErrorRowsByCount()" class="border border-indigo-200 bg-indigo-50 text-indigo-900 font-bold rounded-lg px-3 py-1 text-sm outline-none">
                            <option value="0">0개 (만점/오답 없음)</option>
                            <option value="1" selected>1개 틀림</option>
                            <option value="2">2개 틀림</option>
                            <option value="3">3개 틀림</option>
                            <option value="4">4개 틀림</option>
                            <option value="5">5개 틀림</option>
                            <option value="6">6개 틀림</option>
                            <option value="7">7개 틀림</option>
                            <option value="8">8개 틀림</option>
                            <option value="9">9개 틀림</option>
                            <option value="10">10개 틀림</option>
                            <option value="11">11개 틀림</option>
                            <option value="12">12개 틀림</option>
                            <option value="13">13개 틀림</option>
                            <option value="14">14개 틀림</option>
                            <option value="15">15개 틀림</option>
                        </select>
                    </div>

                    <div id="error-items-container" class="space-y-3 pt-2"></div>
                </div>

                <div class="border-t pt-4">
                    <label class="block text-xs font-bold text-slate-600 mb-1">시험 총평 / 반성 메모</label>
                    <textarea id="form-memo" rows="2" placeholder="시간 배분 문제, 시험 컨디션 등을 메모하세요." class="w-full border border-slate-300 rounded-lg p-3 text-sm focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <div class="flex justify-end gap-2 border-t pt-4">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-lg border border-slate-300 text-slate-600 hover:bg-slate-50 text-sm font-semibold">취소</button>
                    <button type="submit" class="px-5 py-2 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-semibold shadow-sm">저장하기</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 오답 복습 상세보기 모달 -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 flex items-center justify-center hidden p-4 overflow-y-auto">
        <div class="bg-white rounded-2xl shadow-xl w-full max-w-3xl max-h-[90vh] overflow-y-auto border border-slate-100">
            <div class="sticky top-0 bg-white px-6 py-4 border-b flex justify-between items-center z-10">
                <div>
                    <span id="detail-subject-badge" class="px-2 py-0.5 rounded text-xs font-bold bg-indigo-100 text-indigo-700">과목</span>
                    <h3 id="detail-title" class="text-base font-bold text-slate-800 inline ml-2">시험 상세</h3>
                </div>
                <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <div id="detail-body" class="p-6 space-y-6"></div>
        </div>
    </div>

    <!-- 캔버스 모달 (확대/펜/색상피커/획지우개 지원) -->
    <div id="image-zoom-modal" class="fixed inset-0 bg-black/90 z-[100] flex flex-col items-center justify-between hidden p-2 sm:p-4 select-none">
        <div class="w-full max-w-4xl bg-slate-800/95 text-white px-4 py-2 rounded-t-xl flex flex-wrap items-center justify-between gap-3 border-b border-slate-700 z-10">
            <div class="flex items-center gap-3 flex-wrap">
                <div class="flex bg-slate-900 p-1 rounded-lg border border-slate-700">
                    <button id="btn-mode-pen" onclick="setDrawMode('pen')" class="px-3 py-1 text-xs bg-indigo-600 text-white rounded font-bold transition flex items-center gap-1">
                        <i class="fa-solid fa-pen"></i> 펜
                    </button>
                    <button id="btn-mode-eraser" onclick="setDrawMode('eraser')" class="px-3 py-1 text-xs text-slate-300 hover:text-white rounded font-bold transition flex items-center gap-1">
                        <i class="fa-solid fa-eraser"></i> 획 지우개
                    </button>
                </div>

                <div id="pen-tools" class="flex items-center gap-2 border-l border-slate-700 pl-3">
                    <span class="text-xs font-semibold text-slate-400">색상:</span>
                    <button onclick="setPenColor('#f43f5e')" class="w-6 h-6 rounded-full bg-rose-500 border-2 border-white hover:scale-110 transition shadow"></button>
                    <button onclick="setPenColor('#3b82f6')" class="w-6 h-6 rounded-full bg-blue-500 border-2 border-white hover:scale-110 transition shadow"></button>
                    <button onclick="setPenColor('#10b981')" class="w-6 h-6 rounded-full bg-emerald-500 border-2 border-white hover:scale-110 transition shadow"></button>
                    <button onclick="setPenColor('#f59e0b')" class="w-6 h-6 rounded-full bg-amber-500 border-2 border-white hover:scale-110 transition shadow"></button>
                    <button onclick="setPenColor('#ffffff')" class="w-6 h-6 rounded-full bg-white border-2 border-slate-300 hover:scale-110 transition shadow"></button>

                    <label class="relative cursor-pointer flex items-center gap-1 bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded text-xs text-slate-200 font-bold">
                        <i class="fa-solid fa-palette text-indigo-400"></i> 직접선택
                        <input type="color" id="color-picker" onchange="setPenColor(this.value)" class="opacity-0 absolute w-0 h-0">
                    </label>
                </div>

                <div class="flex items-center gap-2 border-l border-slate-700 pl-3">
                    <span class="text-xs font-semibold text-slate-400">두께:</span>
                    <input type="range" id="pen-size-slider" min="1" max="30" value="3" oninput="changePenSize(this.value)" class="w-20 accent-indigo-500 cursor-pointer">
                    <span id="pen-size-val" class="text-xs font-mono font-bold text-indigo-300 w-5">3px</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="clearCanvas()" class="px-3 py-1.5 bg-rose-600/80 hover:bg-rose-600 text-white rounded-lg text-xs font-bold transition">
                    <i class="fa-solid fa-rotate-left mr-1"></i>전체 지우기
                </button>
                <button onclick="closeImageZoom()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-white rounded-lg text-xs font-bold transition">
                    <i class="fa-solid fa-xmark mr-1"></i>닫기
                </button>
            </div>
        </div>

        <div class="relative max-w-4xl max-h-[80vh] w-full flex-1 flex items-center justify-center bg-slate-950/80 rounded-b-xl overflow-hidden border border-slate-700">
            <canvas id="zoom-canvas" class="cursor-crosshair max-w-full max-h-[78vh] object-contain"></canvas>
        </div>
        <p class="text-white/60 text-[11px] mt-2">
            <i class="fa-solid fa-circle-info mr-1"></i>[획 지우개] 필기한 선 위를 건드리면 해당 획 전체가 삭제됩니다.
        </p>
    </div>

    <!-- JS 스크립트 -->
    <script>
        // 고유 과목 컬러 맵 (ReprintOCR 스타일)
        const SUBJECT_COLORS = {
            '국어': { border: '#3b82f6', bg: '#eff6ff' },
            '수학': { border: '#10b981', bg: '#ecfdf5' },
            '영어': { border: '#f59e0b', bg: '#fffbeb' },
            '탐구·세계지리': { border: '#8b5cf6', bg: '#f5f3ff' },
            '탐구·지구과학I': { border: '#ef4444', bg: '#fef2f2' },
            '탐구1': { border: '#8b5cf6', bg: '#f5f3ff' },
            '탐구2': { border: '#ef4444', bg: '#fef2f2' },
            '기타': { border: '#6b7280', bg: '#f9fafb' }
        };

        // 기본 데모 데이터
        const DEFAULT_EXAMS = [
            { id: 1, subject: '국어', detailSubject: '언어와 매체', title: '2027학년도 6월 모의평가', date: '2026-06-04', score: 97, grade: 1, errorItems: [{num:'13', unit:'독서', reason:'개념 부족'}] },
            { id: 2, subject: '국어', detailSubject: '언어와 매체', title: '2027학년도 9월 모의평가', date: '2026-09-02', score: 85, grade: 2, errorItems: [{num:'15', unit:'문학', reason:'문제 오독'}] },
            { id: 3, subject: '국어', detailSubject: '언어와 매체', title: '시대인재 9월 서바이벌 프로', date: '2026-09-24', score: 87, grade: 1, errorItems: [{num:'22', unit:'독서', reason:'계산 실수'}] },
            { id: 4, subject: '수학', detailSubject: '미적분', title: '2027학년도 시대인재 서바이벌 모의고사 16회', date: '2026-09-26', score: 84, grade: 1, errorItems: [{num:'28', unit:'적분', reason:'계산 실수'}] },
            { id: 5, subject: '탐구1', detailSubject: '세계지리', title: '2027학년도 Promenade Meridian A 모의고사', date: '2026-09-26', score: 46, grade: 1, errorItems: [{num:'10', unit:'자료해석', reason:'개념 부족'}] },
            { id: 6, subject: '탐구2', detailSubject: '지구과학I', title: '2027학년도 시대인재 서바이벌 모의고사 16회', date: '2026-09-26', score: 43, grade: 2, errorItems: [{num:'19', unit:'개념', reason:'시간 부족'}] }
        ];

        let examData = JSON.parse(localStorage.getItem('mockExamsData_v2')) || DEFAULT_EXAMS;
        let currentTab = 'ALL';
        let viewMode = 'score'; // 'score' 또는 'grade'
        let trendChartInstance = null;

        // 캔버스 관련
        let zoomCanvas, zoomCtx;
        let isDrawing = false;
        let drawMode = 'pen';
        let currentPenColor = '#f43f5e';
        let currentPenWidth = 3;
        let currentBaseImage = new Image();
        let strokes = [];
        let currentStroke = null;

        window.addEventListener('DOMContentLoaded', () => {
            document.getElementById('form-date').value = new Date().toISOString().substring(0, 10);
            
            zoomCanvas = document.getElementById('zoom-canvas');
            zoomCtx = zoomCanvas.getContext('2d');
            setupCanvasEvents();

            renderCharts();
            renderExamList();
        });

        function toggleViewMode(mode) {
            viewMode = mode;
            const scoreBtn = document.getElementById('mode-score-btn');
            const gradeBtn = document.getElementById('mode-grade-btn');

            if(mode === 'score') {
                scoreBtn.className = "px-4 py-1.5 rounded-md bg-indigo-600 text-white shadow-sm transition";
                gradeBtn.className = "px-4 py-1.5 rounded-md text-slate-500 hover:text-slate-900 transition";
            } else {
                gradeBtn.className = "px-4 py-1.5 rounded-md bg-indigo-600 text-white shadow-sm transition";
                scoreBtn.className = "px-4 py-1.5 rounded-md text-slate-500 hover:text-slate-900 transition";
            }
            renderCharts();
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.className = "tab-btn px-3 py-1.5 rounded-md text-slate-500";
            });
            const activeBtn = document.getElementById(`tab-${tab}`);
            if(activeBtn) {
                activeBtn.className = "tab-btn px-3 py-1.5 rounded-md bg-indigo-50 text-indigo-600";
            }

            renderCharts();
            renderExamList();
        }

        // 스크린샷과 동일한 멀티 라인 추세 차트 렌더링
        function renderCharts() {
            const ctx = document.getElementById('trendChart').getContext('2d');
            if(trendChartInstance) trendChartInstance.destroy();

            // 날짜 추출
            const sortedExams = [...examData].sort((a, b) => new Date(a.date) - new Date(b.date));
            const dates = [...new Set(sortedExams.map(e => e.date.substring(5)))];

            // 과목 그룹화
            const subjectMap = {};
            sortedExams.forEach(e => {
                const key = e.detailSubject ? `${e.subject}·${e.detailSubject}` : e.subject;
                if(!subjectMap[key]) subjectMap[key] = [];
                subjectMap[key].push(e);
            });

            const datasets = [];
            const legendContainer = document.getElementById('subject-legend-container');
            legendContainer.innerHTML = '';

            Object.keys(subjectMap).forEach(subjKey => {
                const colorInfo = SUBJECT_COLORS[subjKey] || SUBJECT_COLORS[subjKey.split('·')[0]] || SUBJECT_COLORS['기타'];
                const exams = subjectMap[subjKey];

                const dataPoints = dates.map(d => {
                    const found = exams.find(e => e.date.substring(5) === d);
                    if(!found) return null;
                    return viewMode === 'score' ? found.score : found.grade;
                });

                datasets.push({
                    label: subjKey,
                    data: dataPoints,
                    borderColor: colorInfo.border,
                    backgroundColor: colorInfo.border,
                    borderWidth: 2.5,
                    tension: 0.2,
                    spanGaps: true,
                    pointRadius: 5,
                    pointHoverRadius: 7
                });

                // 스크린샷 하단 스타일 뱃지 생성
                const latestExam = exams[exams.length - 1];
                const badge = document.createElement('div');
                badge.className = "inline-flex items-center gap-1.5 bg-slate-50 border border-slate-200 px-3 py-1 rounded-xl text-xs text-slate-700 shadow-sm font-semibold";
                badge.innerHTML = `
                    <span class="w-2.5 h-2.5 rounded-full" style="background-color: ${colorInfo.border};"></span>
                    <strong class="text-slate-800">${subjKey}</strong>
                    <span class="text-indigo-600 font-bold ml-1">${latestExam.score}점</span>
                    <span class="text-slate-400">· 오답 ${latestExam.errorItems ? latestExam.errorItems.length : 0}개</span>
                `;
                legendContainer.appendChild(badge);
            });

            trendChartInstance = new Chart(ctx, {
                type: 'line',
                data: { labels: dates, datasets: datasets },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            min: viewMode === 'score' ? 0 : 1,
                            max: viewMode === 'score' ? 100 : 9,
                            reverse: viewMode === 'grade', // 등급일 땐 1등급이 상단
                            grid: { color: '#f1f5f9' }
                        },
                        x: { grid: { display: false } }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        // 스크린샷 스타일 과목별 카드 리스트 렌더링
        function renderExamList() {
            const container = document.getElementById('exam-list-container');
            const keyword = document.getElementById('search-keyword').value.toLowerCase();
            container.innerHTML = '';

            let filtered = [...examData];

            if(currentTab !== 'ALL') {
                if(currentTab === '탐구') filtered = filtered.filter(e => e.subject.includes('탐구'));
                else filtered = filtered.filter(e => e.subject === currentTab);
            }

            if(keyword) {
                filtered = filtered.filter(e => 
                    e.title.toLowerCase().includes(keyword) || 
                    (e.detailSubject && e.detailSubject.toLowerCase().includes(keyword))
                );
            }

            // 과목 그룹으로 묶어 표시
            const grouped = {};
            filtered.reverse().forEach(exam => {
                const groupKey = exam.detailSubject ? `${exam.subject} · ${exam.detailSubject}` : exam.subject;
                if(!grouped[groupKey]) grouped[groupKey] = [];
                grouped[groupKey].push(exam);
            });

            if(Object.keys(grouped).length === 0) {
                container.innerHTML = `<div class="p-8 text-center text-slate-400 text-sm">기록된 채점 모의고사가 없습니다.</div>`;
                return;
            }

            for(const [groupTitle, list] of Object.entries(grouped)) {
                const groupSection = document.createElement('div');
                groupSection.className = "space-y-2.5";

                let itemsHtml = list.map(exam => `
                    <div onclick="openDetailModal(${exam.id})" class="bg-white hover:bg-slate-50/80 transition rounded-2xl border border-slate-200/90 p-4 sm:p-5 flex items-center justify-between cursor-pointer shadow-sm">
                        <div class="space-y-1">
                            <p class="text-[11px] font-bold text-slate-400">${exam.subject}${exam.detailSubject ? ' · ' + exam.detailSubject : ''}</p>
                            <h3 class="font-bold text-slate-800 text-sm sm:text-base">${exam.title}</h3>
                            <p class="text-xs text-slate-400 font-mono">${exam.date}</p>
                        </div>
                        <div class="text-right">
                            <p class="text-lg sm:text-xl font-extrabold text-slate-900">${exam.score}점</p>
                            <p class="text-xs text-slate-400 font-medium">
                                ${exam.grade ? exam.grade + '등급 · ' : ''}오답 ${exam.errorItems ? exam.errorItems.length : 0}개
                            </p>
                        </div>
                    </div>
                `).join('');

                groupSection.innerHTML = `
                    <h3 class="text-xs font-bold text-slate-500 pl-1">${groupTitle}</h3>
                    <div class="space-y-2">${itemsHtml}</div>
                `;
                container.appendChild(groupSection);
            }
        }

        function openModal(editId = null) {
            document.getElementById('exam-form').reset();
            document.getElementById('error-items-container').innerHTML = '';
            document.getElementById('editing-exam-id').value = '';

            if(editId) {
                const exam = examData.find(e => e.id === editId);
                if(exam) {
                    document.getElementById('editing-exam-id').value = exam.id;
                    document.getElementById('form-subject').value = exam.subject;
                    document.getElementById('form-detail-subject').value = exam.detailSubject || '';
                    document.getElementById('form-title').value = exam.title;
                    document.getElementById('form-date').value = exam.date;
                    document.getElementById('form-score').value = exam.score;
                    document.getElementById('form-grade').value = exam.grade;
                    document.getElementById('form-memo').value = exam.memo || '';

                    const count = exam.errorItems ? exam.errorItems.length : 0;
                    document.getElementById('form-error-count').value = count;
                    generateErrorRowsByCount(exam.errorItems);
                }
            } else {
                document.getElementById('form-date').value = new Date().toISOString().substring(0, 10);
                document.getElementById('form-error-count').value = 1;
                generateErrorRowsByCount();
            }

            document.getElementById('exam-modal').classList.remove('hidden');
        }

        function closeModal() { document.getElementById('exam-modal').classList.add('hidden'); }
        function closeDetailModal() { document.getElementById('detail-modal').classList.add('hidden'); }

        function handleSubjectOrCountChange() { generateErrorRowsByCount(); }

        function generateErrorRowsByCount(existingItems = null) {
            const container = document.getElementById('error-items-container');
            const count = parseInt(document.getElementById('form-error-count').value);
            container.innerHTML = '';

            for (let i = 0; i < count; i++) {
                const data = (existingItems && existingItems[i]) ? existingItems[i] : {};
                const itemDiv = document.createElement('div');
                itemDiv.className = "bg-slate-50 p-3 rounded-xl border border-slate-200 space-y-2";

                itemDiv.innerHTML = `
                    <div class="flex items-center justify-between font-bold text-xs text-indigo-900">
                        <span>오답 문항 #${i + 1}</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2">
                        <input type="text" class="err-num border border-slate-300 rounded px-2 py-1 text-xs" placeholder="번호 (15번)" value="${data.num || ''}" required>
                        <input type="text" class="err-unit border border-slate-300 rounded px-2 py-1 text-xs" placeholder="영역/단원" value="${data.unit || ''}">
                        <select class="err-reason border border-slate-300 rounded px-2 py-1 text-xs">
                            <option value="개념 부족" ${data.reason === '개념 부족' ? 'selected' : ''}>개념 부족</option>
                            <option value="계산 실수" ${data.reason === '계산 실수' ? 'selected' : ''}>계산 실수</option>
                            <option value="시간 부족" ${data.reason === '시간 부족' ? 'selected' : ''}>시간 부족</option>
                            <option value="문제 오독" ${data.reason === '문제 오독' ? 'selected' : ''}>문제 오독</option>
                        </select>
                    </div>
                    <input type="text" class="err-note border border-slate-300 rounded px-2 py-1 text-xs w-full" placeholder="복습 핵심 메모" value="${data.note || ''}">
                    <input type="file" accept="image/*,application/pdf" class="err-file text-xs text-slate-500">
                `;
                container.appendChild(itemDiv);
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const editingId = document.getElementById('editing-exam-id').value;
            const subject = document.getElementById('form-subject').value;
            const detailSubject = document.getElementById('form-detail-subject').value;
            const title = document.getElementById('form-title').value;
            const date = document.getElementById('form-date').value;
            const score = parseInt(document.getElementById('form-score').value);
            const grade = parseInt(document.getElementById('form-grade').value);
            const memo = document.getElementById('form-memo').value;

            const errorRows = document.querySelectorAll('#error-items-container > div');
            const errorItems = [];

            for (let row of errorRows) {
                const num = row.querySelector('.err-num').value;
                const unit = row.querySelector('.err-unit').value || '기타';
                const reason = row.querySelector('.err-reason').value;
                const note = row.querySelector('.err-note').value;
                const fileInput = row.querySelector('.err-file');
                let fileData = '';

                if (fileInput.files && fileInput.files[0]) {
                    fileData = await readFileAsBase64(fileInput.files[0]);
                }

                if (num) errorItems.push({ num, unit, reason, note, fileData });
            }

            if(editingId) {
                const idx = examData.findIndex(e => e.id == editingId);
                if(idx !== -1) examData[idx] = { id: parseInt(editingId), subject, detailSubject, title, date, score, grade, memo, errorItems };
            } else {
                examData.push({ id: Date.now(), subject, detailSubject, title, date, score, grade, memo, errorItems });
            }

            localStorage.setItem('mockExamsData_v2', JSON.stringify(examData));
            closeModal();
            renderCharts();
            renderExamList();
        }

        function readFileAsBase64(file) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.readAsDataURL(file);
            });
        }

        function openDetailModal(id) {
            const exam = examData.find(e => e.id === id);
            if(!exam) return;

            document.getElementById('detail-subject-badge').innerText = exam.subject;
            document.getElementById('detail-title').innerText = `${exam.title} (${exam.score}점)`;

            const body = document.getElementById('detail-body');
            body.innerHTML = `
                <div class="space-y-3">
                    <p class="text-xs text-slate-500 font-bold">오답 상세 문항 (${exam.errorItems ? exam.errorItems.length : 0}개)</p>
                    ${exam.errorItems && exam.errorItems.length > 0 ? exam.errorItems.map(item => `
                        <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-xs space-y-1">
                            <span class="font-extrabold text-rose-600">${item.num}번</span>
                            <span class="text-slate-500">(${item.unit}) -${item.reason}</span>
                            <p class="text-slate-700 bg-white p-2 rounded border border-slate-100 mt-1">${item.note || '메모 없음'}</p>
                            ${item.fileData ? `<button onclick="zoomImage('${item.fileData}')" class="text-indigo-600 font-bold underline mt-1">🎨 크게 보고 펜/획지우개로 풀어보기</button>` : ''}
                        </div>
                    `).join('') : '<p class="text-xs text-slate-400">오답 기록이 없습니다.</p>'}
                </div>
            `;
            document.getElementById('detail-modal').classList.remove('hidden');
        }

        // --- 획지우개 & 캔버스 드로잉 엔진 ---
        function zoomImage(src) {
            strokes = [];
            currentBaseImage = new Image();
            currentBaseImage.src = src;
            currentBaseImage.onload = () => {
                zoomCanvas.width = currentBaseImage.width;
                zoomCanvas.height = currentBaseImage.height;
                redrawCanvas();
                document.getElementById('image-zoom-modal').classList.remove('hidden');
            };
        }

        function closeImageZoom() { document.getElementById('image-zoom-modal').classList.add('hidden'); }

        function setDrawMode(mode) {
            drawMode = mode;
            document.getElementById('btn-mode-pen').className = mode === 'pen' ? "px-3 py-1 text-xs bg-indigo-600 text-white rounded font-bold transition flex items-center gap-1" : "px-3 py-1 text-xs text-slate-300 hover:text-white rounded font-bold transition flex items-center gap-1";
            document.getElementById('btn-mode-eraser').className = mode === 'eraser' ? "px-3 py-1 text-xs bg-rose-600 text-white rounded font-bold transition flex items-center gap-1" : "px-3 py-1 text-xs text-slate-300 hover:text-white rounded font-bold transition flex items-center gap-1";
        }

        function setPenColor(color) {
            setDrawMode('pen');
            currentPenColor = color;
            document.getElementById('color-picker').value = color;
        }

        function changePenSize(val) {
            currentPenWidth = parseInt(val);
            document.getElementById('pen-size-val').innerText = `${val}px`;
        }

        function clearCanvas() { strokes = []; redrawCanvas(); }

        function redrawCanvas() {
            zoomCtx.clearRect(0, 0, zoomCanvas.width, zoomCanvas.height);
            if (currentBaseImage.src) zoomCtx.drawImage(currentBaseImage, 0, 0);

            strokes.forEach(stroke => {
                if (stroke.points.length < 1) return;
                zoomCtx.beginPath();
                zoomCtx.moveTo(stroke.points[0].x, stroke.points[0].y);
                for (let i = 1; i < stroke.points.length; i++) {
                    zoomCtx.lineTo(stroke.points[i].x, stroke.points[i].y);
                }
                zoomCtx.strokeStyle = stroke.color;
                zoomCtx.lineWidth = stroke.width * (zoomCanvas.width / 800);
                zoomCtx.lineCap = 'round';
                zoomCtx.lineJoin = 'round';
                zoomCtx.stroke();
            });
        }

        function isPointNearStroke(pt, stroke) {
            const threshold = Math.max(15, stroke.width * (zoomCanvas.width / 800));
            for (let i = 0; i < stroke.points.length - 1; i++) {
                if (distToSegment(pt, stroke.points[i], stroke.points[i + 1]) <= threshold) return true;
            }
            return false;
        }

        function distToSegment(p, v, w) {
            const l2 = (v.x - w.x) ** 2 + (v.y - w.y) ** 2;
            if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
            let t = Math.max(0, Math.min(1, ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2));
            return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
        }

        function eraseStrokeAt(pos) {
            let erased = false;
            strokes = strokes.filter(s => {
                const hit = isPointNearStroke(pos, s);
                if (hit) erased = true;
                return !hit;
            });
            if (erased) redrawCanvas();
        }

        function setupCanvasEvents() {
            const getPos = (e) => {
                const rect = zoomCanvas.getBoundingClientRect();
                const scaleX = zoomCanvas.width / rect.width;
                const scaleY = zoomCanvas.height / rect.height;
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                return { x: (clientX - rect.left) * scaleX, y: (clientY - rect.top) * scaleY };
            };

            const startDrawing = (e) => {
                isDrawing = true;
                const pos = getPos(e);
                if (drawMode === 'pen') {
                    currentStroke = { color: currentPenColor, width: currentPenWidth, points: [pos] };
                    strokes.push(currentStroke);
                    redrawCanvas();
                } else if (drawMode === 'eraser') eraseStrokeAt(pos);
            };

            const draw = (e) => {
                if (!isDrawing) return;
                e.preventDefault();
                const pos = getPos(e);
                if (drawMode === 'pen' && currentStroke) {
                    currentStroke.points.push(pos);
                    redrawCanvas();
                } else if (drawMode === 'eraser') eraseStrokeAt(pos);
            };

            const stopDrawing = () => { isDrawing = false; currentStroke = null; };

            zoomCanvas.addEventListener('mousedown', startDrawing);
            zoomCanvas.addEventListener('mousemove', draw);
            zoomCanvas.addEventListener('mouseup', stopDrawing);
            zoomCanvas.addEventListener('mouseleave', stopDrawing);

            zoomCanvas.addEventListener('touchstart', startDrawing);
            zoomCanvas.addEventListener('touchmove', draw);
            zoomCanvas.addEventListener('touchend', stopDrawing);
        }
    </script>
</body>
